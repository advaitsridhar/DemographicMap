<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SegmentedControl — preview</title>
<style>
  /* Frame only: slices of the filters panel (330px column, its inline gutter,
     surface-1) on the page ground; each section brings its own top margin. */
  body { padding: 16px; }
  .board { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
  .pane {
    width: calc(var(--filters-w) + 1px);
    padding: 0 var(--gutter-panel) var(--section-gap);
    background: var(--surface-1);
    border: 1px solid var(--hairline);
  }
</style>
</head>
<body>
<div class="board">

  <div class="pane">
    <section class="filter-section">
      <h3 id="field-label">Topic
        <button type="button" class="info" data-info="topic" aria-label="About comparing topics across borders">i</button>
      </h3>
      <div class="segmented" role="radiogroup" aria-labelledby="field-label"><button type="button" role="radio" class="seg" data-value="religion" aria-checked="true" tabindex="0">Religion</button><button type="button" role="radio" class="seg" data-value="language" aria-checked="false" tabindex="-1">Language</button><button type="button" role="radio" class="seg" data-value="ethnicity" aria-checked="false" tabindex="-1">Ethnicity</button></div>
    </section>
  </div>

  <div class="pane">
    <section class="filter-section">
      <h3 id="depth-label">Categories
        <button type="button" class="info" data-info="depth" aria-label="About broad families and reported categories">i</button>
      </h3>
      <div class="segmented" role="radiogroup" aria-labelledby="depth-label"><button type="button" role="radio" class="seg" data-value="1" aria-checked="false" tabindex="-1">Traditions</button><button type="button" role="radio" class="seg" data-value="2" aria-checked="true" tabindex="0">Religions</button><button type="button" role="radio" class="seg" data-value="3" aria-checked="false" tabindex="-1">As reported</button></div>
    </section>

    <section class="filter-section">
      <h3 id="spread-label">Shading
        <button type="button" class="info" data-info="spread" aria-label="About how the shading is scaled">i</button>
      </h3>
      <div class="segmented" role="radiogroup" aria-labelledby="spread-label"><button type="button" role="radio" class="seg" data-value="absolute" aria-checked="true" tabindex="0">Full range</button><button type="button" role="radio" class="seg" data-value="fit" aria-checked="false" tabindex="-1">Fit to view</button></div>
    </section>
  </div>

</div>
</body>
</html>
