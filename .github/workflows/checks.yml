name: Checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The tests read real workbooks and PDFs through the same libraries the
      # adapters do -- India's C-01 appendix is an .xlsx and its test builds
      # one with openpyxl rather than faking the API. Without this step those
      # tests error on a missing module, and unittest reports the error as a
      # failure of the thing being tested. That is how thirteen India tests
      # spent two merges red while passing on every machine that had the
      # requirements installed.
      - name: Install the ETL dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile the ETL scripts
        run: python3 -m compileall -q scripts

      - name: Syntax-check the frontend
        run: for f in site/js/*.js; do node --check "$f"; done

      - name: Frontend regression tests
        run: node tests/test_frontend.js

      - name: Shell syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      # Reports, never blocks. A pull request that adds an adapter cannot
      # rebuild site/data -- that join needs the 550 MB boundary files -- so
      # failing here would block the very change being reported on. It exists
      # because nothing else connects "adapter merged" to "visible on the
      # map", and a person had to notice South Africa was missing.
      - name: Is site/data current with the adapters?
        run: python3 scripts/check_site_fresh.py
