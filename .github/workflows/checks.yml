name: Checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Byte-compile the ETL scripts
        run: python3 -m compileall -q scripts

      - name: Syntax-check the frontend
        run: for f in site/js/*.js; do node --check "$f"; done

      - name: Shell syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
