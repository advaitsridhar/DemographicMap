name: Run one adapter

# The full refresh runs every source and takes the better part of an hour, which
# is the wrong tool for adding a single country: most of that time is spent
# re-fetching data that has not changed, and any of those sources being slow or
# down delays the one thing being worked on. This runs one adapter and pushes
# its output under data/processed.
#
# It exists because the build sandbox cannot reach statistical hosts. The
# adapter has to run somewhere with open egress, and this is that somewhere.
#
# It deliberately does NOT rebuild site/data. That join needs the CGAZ boundary
# files, which are ~550 MB and not in git, so this runner has no shapes; the
# first version of this workflow ran the build anyway and committed a search
# index with every subnational division missing. Fetching half a gigabyte of
# geometry on every adapter run to avoid that is the wrong trade -- the site
# rebuild belongs where the boundaries already are.
on:
  # Dispatch only, now that this workflow is on the default branch and the form
  # is offered. It used to carry a push trigger naming one adapter, because
  # workflow_dispatch is not offered for a workflow that exists only on the
  # branch introducing it -- which is exactly when it is first wanted. That
  # scaffolding has served its purpose; left in place it would silently re-run
  # Mexico on any edit to Mexico, whatever the run was meant to be for.
  workflow_dispatch:
    inputs:
      command:
        description: >-
          Module and arguments. An adapter, e.g.
          'scripts.fetch_census.mexico --level both', or a read-only probe,
          e.g. 'scripts.probe_links https://example.org/census --match xlsx'
          with commit off.
        type: string
        required: true
      commit:
        description: "Commit and push what changed"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Run the adapter
        env:
          ADAPTER: ${{ inputs.command }}
        # xargs rather than an unquoted expansion: the command is a dispatch
        # input, and a URL with a query string carries "&", which bash reads as
        # "background this and run the rest". A probe URL ending "&rows=25" ran
        # the fetch in the background, ended the step immediately and killed it,
        # while the job reported success. xargs splits on whitespace and gives
        # the pieces to python directly, so no shell metacharacter in an input
        # is interpreted -- which also means a dispatch input cannot smuggle a
        # second command into this runner.
        run: printf '%s' "$ADAPTER" | xargs python3 -m

      - name: Commit
        if: inputs.commit != 'false'
        env:
          ADAPTER: ${{ inputs.command }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/raw too: a source with no fetchable URL is checked in,
          # and .gitignore names the few directories that applies to.
          git add -A data/processed data/raw
          if git diff --cached --quiet; then
            echo "nothing changed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached --stat >> "$GITHUB_STEP_SUMMARY"
          git commit -m "Data: $ADAPTER"
          git push origin HEAD:${{ github.ref_name }}
          echo "Now run scripts/build_entities.py where the boundaries are." \
            >> "$GITHUB_STEP_SUMMARY"
