name: Probe a data source

# The build sandbox cannot reach statistical hosts, so this runs a read-only
# discovery script on a runner (which can) and prints what a candidate source
# actually contains -- schema, record counts, sample rows. Nothing is written
# and nothing is committed: the output is the log, used to decide whether a
# source is worth an adapter and to write that adapter against a real schema
# rather than a guess.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "Source type"
        type: choice
        options: [arcgis, url, pdf, datagovsg]
        default: arcgis
      target:
        description: "ArcGIS item id or URL; kind=url/pdf a direct URL; kind=datagovsg a search term"
        type: string
        required: true
      terms:
        description: "kind=pdf: comma-separated terms to find pages for"
        type: string
        default: "language,mother tongue,speak"
        required: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe ArcGIS item
        if: inputs.kind == 'arcgis'
        run: |
          python3 scripts/probe_arcgis.py "${{ inputs.target }}" --samples 3

      - name: Probe PDF
        if: inputs.kind == 'pdf'
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y poppler-utils
          curl -sSL --max-time 300 --max-filesize 200000000 \
            -o /tmp/probe.pdf "${{ inputs.target }}"
          file /tmp/probe.pdf
          pdfinfo /tmp/probe.pdf | sed -n '1,12p'
          # -layout keeps column alignment, which is what makes a census table
          # in a PDF readable at all once it is text.
          pdftotext -layout /tmp/probe.pdf /tmp/probe.txt
          python3 scripts/probe_pdf.py /tmp/probe.txt --terms "${{ inputs.terms }}"

      - name: Probe data.gov.sg
        if: inputs.kind == 'datagovsg'
        # The key is passed through the environment from the repository secret
        # and never appears in a command line or a log. The script reports only
        # whether one was found and how long it is, which is enough to tell a
        # missing secret from a rejected one.
        env:
          DEMOGRAPHICMAP: ${{ secrets.DEMOGRAPHICMAP }}
        run: |
          python3 scripts/probe_datagovsg.py --raw --catalogue --search "${{ inputs.target }}"

      - name: Probe plain URL
        if: inputs.kind == 'url'
        run: |
          # Headers first, then the leading bytes -- enough to tell a CSV from
          # an HTML error page without downloading a large file in full.
          curl -sSIL --max-time 60 "${{ inputs.target }}" | sed -n '1,25p'
          curl -sSL --max-time 120 --max-filesize 20000000 \
            -o /tmp/probe.body "${{ inputs.target }}"
          echo '--- first 4 KB ---'
          head -c 4096 /tmp/probe.body
          # Licensing is the gate on whether a source can be used at all, and it
          # is never in the first 4 KB of a JavaScript-heavy page. Strip the
          # markup and show the sentences that decide it.
          echo
          echo '--- lines mentioning terms of use ---'
          python3 - <<'PYEOF'
          import json, re, sys
          raw = open("/tmp/probe.body", encoding="utf-8", errors="replace").read()

          # A machine-readable answer beats a prose one. Repositories that
          # deposit through OSF, Zenodo, CKAN or DataCite record the licence as
          # a field, so when the body is JSON, say what that field holds rather
          # than hunting for a sentence that may not exist.
          def licence_fields(node, path=""):
              if isinstance(node, dict):
                  for key, value in node.items():
                      here = f"{path}.{key}" if path else key
                      if "licen" in key.lower() or "rights" in key.lower():
                          print("  #", here, "=", json.dumps(value)[:300])
                      licence_fields(value, here)
              elif isinstance(node, list):
                  for i, value in enumerate(node[:20]):
                      licence_fields(value, f"{path}[{i}]")

          try:
              print("--- licence fields in JSON body ---")
              licence_fields(json.loads(raw))
          except ValueError:
              print("  (body is not JSON)")
          text = re.sub(r"<(script|style)[^>]*>.*?</\1>", " ", raw, flags=re.S | re.I)
          text = re.sub(r"<[^>]+>", " ", text)
          text = re.sub(r"&[a-z]+;", " ", text)
          words = ("licen", "copyright", "terms of use", "citation", "cite",
                   "permission", "redistribut", "attribution", "public domain",
                   "creative commons", "free of charge", "may be used")
          seen = set()
          for sentence in re.split(r"(?<=[.!?])\s+|\n{2,}", text):
              flat = " ".join(sentence.split())
              if 20 < len(flat) < 400 and any(w in flat.lower() for w in words):
                  if flat not in seen:
                      seen.add(flat)
                      print("  *", flat)
          print(f"  ({len(seen)} matching sentences)")
          PYEOF
