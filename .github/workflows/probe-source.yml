name: Probe a data source

# The build sandbox cannot reach statistical hosts, so this runs a read-only
# discovery script on a runner (which can) and prints what a candidate source
# actually contains -- schema, record counts, sample rows. Nothing is written
# and nothing is committed: the output is the log, used to decide whether a
# source is worth an adapter and to write that adapter against a real schema
# rather than a guess.
on:
  # workflow_dispatch only becomes available once this file is on the default
  # branch, so a push trigger scoped to this file lets the probe run from a
  # feature branch: edit PROBE_TARGET below, push, read the log.
  push:
    paths:
      - ".github/workflows/probe-source.yml"
      - "scripts/probe_arcgis.py"
  workflow_dispatch:
    inputs:
      kind:
        description: "Source type"
        type: choice
        options: [arcgis, url]
        default: arcgis
      target:
        description: "ArcGIS item id or portal URL, or for kind=url a direct URL"
        type: string
        required: true

permissions:
  contents: read

env:
  # Used when the run comes from a push, which carries no inputs.
  PROBE_TARGET: "16a1324c517048db890b86a87858a8ef"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Probe ArcGIS item
        if: inputs.kind == 'arcgis' || github.event_name == 'push'
        run: |
          python3 scripts/probe_arcgis.py \
            "${{ inputs.target || env.PROBE_TARGET }}" --samples 3

      - name: Probe plain URL
        if: inputs.kind == 'url'
        run: |
          # Headers first, then the leading bytes -- enough to tell a CSV from
          # an HTML error page without downloading a large file in full.
          curl -sSIL --max-time 60 "${{ inputs.target }}" | sed -n '1,25p'
          echo '--- first 4 KB ---'
          curl -sSL --max-time 120 --max-filesize 20000000 "${{ inputs.target }}" | head -c 4096
